<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Gift for My Best Friend</title>
    <!-- 引入可爱的中文字体：站酷快乐体 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            font-family: sans-serif;
            user-select: none;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            z-index: 10;
            letter-spacing: 2px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* --- 新增：底部祝福语样式 (字体升级) --- */
        #footer-msg {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            font-size: 34px; /* 字体加大，更显可爱 */
            font-weight: 400;
            letter-spacing: 4px;
            /* 增强金色与粉色的混合光晕，更梦幻 */
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.8), 
                0 0 20px rgba(255, 182, 193, 0.5), 
                0 0 30px rgba(255, 105, 180, 0.3);
            pointer-events: none;
            z-index: 10;
            /* 使用站酷快乐体，如果加载失败回退到圆体 */
            font-family: 'ZCOOL KuaiLe', 'YouYuan', 'Comic Sans MS', cursive; 
            padding: 0 40px; 
            box-sizing: border-box;
            opacity: 0; 
            transition: opacity 1.5s ease-in;
            
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.5;
        }

        /* 礼物按钮样式 */
        #gift-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            /* 移除字体大小设置，改用 SVG 控制 */
            /* font-size: 30px; */ 
            
            /* 修改1：去掉了默认的深色背景和显眼边框，改为完全透明 */
            background: transparent; 
            border: none;
            
            /* 设置图标颜色为半透明白，更柔和 */
            color: rgba(255, 255, 255, 0.6); 
            
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: all 0.3s;
        }
        
        /* 鼠标悬停时，图标变亮，微微放大 */
        #gift-btn:hover {
            color: rgba(255, 255, 255, 1);
            transform: scale(1.1) rotate(15deg);
            /* 加一点点光晕，而不是生硬的背景框 */
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.5));
        }

        /* 激活状态（狂欢模式）：变成金色，并带有呼吸光效 */
        #gift-btn.active {
            color: #ffd700;
            filter: drop-shadow(0 0 8px #ffd700);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* 升级版：可爱纸条样式 */
        .retro-note {
            position: absolute;
            background-color: #fff0f5; /* 淡粉色背景 */
            color: #d63384; /* 深粉色文字 */
            padding: 15px 25px; 
            font-family: 'ZCOOL KuaiLe', "Comic Sans MS", "幼圆", sans-serif; /* 纸条也统一用可爱字体 */
            font-weight: normal;
            font-size: 20px; 
            border: 3px dashed #ffb6c1; 
            box-shadow: 0 8px 16px rgba(255, 182, 193, 0.4); 
            border-radius: 20px; 
            pointer-events: none;
            z-index: 15;
            max-width: 280px; 
            line-height: 1.6;
            opacity: 0;
            transform: scale(0.5) rotate(0deg);
            transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; 
        }
        .retro-note.show {
            opacity: 1;
            transform: scale(1) rotate(var(--rot));
        }

        /* 纸条容器 */
        #note-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 15;
        }

        /* --- 新增：开场弹窗样式 --- */
        #intro-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85); /* 深色半透明背景 */
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #fff;
            font-family: 'ZCOOL KuaiLe', sans-serif; /* 弹窗也使用可爱字体 */
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            animation: floatIn 0.5s ease-out;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-title {
            font-size: 32px; /* 标题加大 */
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }
        .modal-btn {
            padding: 12px 35px;
            margin: 10px;
            font-size: 18px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            cursor: pointer;
            background: linear-gradient(45deg, #d63384, #ff6b6b);
            color: white;
            border: none;
            border-radius: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
            letter-spacing: 1px;
        }
        .modal-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(214, 51, 132, 0.5);
        }
        .input-group {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-label {
            font-size: 18px;
            color: #ddd;
        }
        input[type="text"] {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            outline: none;
            font-size: 18px;
            font-family: 'ZCOOL KuaiLe', sans-serif;
            width: 150px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ffd700;
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <!-- 开场对话弹窗 -->
    <div id="intro-modal">
        <div class="modal-content">
            <div class="modal-title">你是大菠萝吗？</div>
            <div>
                <button class="modal-btn" id="yes-btn">是的</button>
            </div>
            
            <div class="input-group">
                <span class="input-label">不，我是</span>
                <input type="text" id="custom-name" placeholder="你的昵称">
                <button class="modal-btn" id="confirm-name-btn" style="padding: 10px 20px; font-size: 16px;">确认</button>
            </div>
        </div>
    </div>

    <div id="info"> 拖动旋转 · 滚轮缩放 · 点击绽放 </div>

    <!-- 礼物按钮 (改为星芒烟花 SVG 图标，更加精致柔和) -->
    <div id="gift-btn" title="专属惊喜">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- 核心星星 -->
            <path d="M12 8L12.8 10.8L15.5 12L12.8 13.2L12 16L11.2 13.2L8.5 12L11.2 10.8L12 8Z" fill="currentColor" fill-opacity="0.8"/>
            <!-- 放射线 -->
            <path d="M12 3V6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M12 18V21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M21 12H18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6 12H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M18.36 5.64L16.24 7.76" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7.76 16.24L5.64 18.36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M18.36 18.36L16.24 16.24" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7.76 7.76L5.64 5.64" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <!-- 装饰小圆点，增加细腻感 -->
            <circle cx="16.5" cy="4.5" r="0.8" fill="currentColor"/>
            <circle cx="19.5" cy="7.5" r="0.8" fill="currentColor"/>
            <circle cx="4.5" cy="16.5" r="0.8" fill="currentColor"/>
            <circle cx="7.5" cy="19.5" r="0.8" fill="currentColor"/>
        </svg>
    </div>

    <!-- 底部祝福语 -->
    <div id="footer-msg"></div>

    <!-- 纸条容器 -->
    <div id="note-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 逻辑控制变量 ---
        let currentSubject = "大菠萝"; // 默认主语
        let gameStarted = false; // 游戏是否开始（控制点击是否触发烟花）

        // --- 语料库生成系统 ---
        const corpus = {
            subjects: ["大菠萝", "你", "咱们的菠萝女孩", "可爱的你"],
            adjectives: ["机智的", "温柔的", "细心的", "古灵精怪的", "闪闪发光的", "甜度满分的", "独一无二的", "迷人的", "充满元气的"],
            features: ["眼神", "笑容", "想法", "幽默感", "侧颜", "心灵", "智慧"],
            actions: ["治愈了世界", "像夏天的风", "是我的开心果", "胜过所有风景", "让人如沐春风", "值得世间美好", "总是那么暖心", "让人心动不已"],
            templates: [
                "{s}的{f}简直{a}！",
                "这就{s}，{a}{f}{ac}。",
                "全世界最{a}{s}，今天也{ac}。",
                "哪怕只看一眼，也被{s}的{f}打动。",
                "这就是{s}吗？{a}得犯规！",
                "{s}的{f}，是我见过的最美风景。",
                "怎么会有{s}这么{a}的女孩子！",
            ],
            // 预设精品短句
            fixed: [
                "大菠萝今天也可爱满分！",
                "你的细心藏在每个细节里。",
                "大菠萝的智商是美貌的赠品。",
                "你的幽默感是稀世珍宝。",
                "看见大菠萝，心情就放晴。",
                "你比菠萝还要甜一点。",
                "大菠萝的眼里有星辰大海。",
                "全世界只有一种大菠萝。",
                "你的存在本身就是礼物。",
                "大菠萝的笑是治愈系魔法。",
                "为你放一场专属烟花！",
                "大菠萝是坠落凡间的天使。",
                "你的善良带有光芒。",
                "大菠萝的每一个点子都绝妙。",
                "你是不被定义的无限可能。"
            ]
        };

        // 获取夸赞函数 (包含名字替换逻辑)
        function getCompliment() {
            let text = "";
            // 30% 概率生成组合句，70% 概率使用精品短句
            if (Math.random() > 0.3) {
                text = corpus.fixed[Math.floor(Math.random() * corpus.fixed.length)];
            } else {
                let t = corpus.templates[Math.floor(Math.random() * corpus.templates.length)];
                t = t.replace("{s}", corpus.subjects[Math.floor(Math.random() * corpus.subjects.length)]);
                t = t.replace("{a}", corpus.adjectives[Math.floor(Math.random() * corpus.adjectives.length)]);
                t = t.replace("{f}", corpus.features[Math.floor(Math.random() * corpus.features.length)]);
                t = t.replace("{ac}", corpus.actions[Math.floor(Math.random() * corpus.actions.length)]);
                text = t;
            }

            // --- 核心逻辑：替换 "大菠萝" 为当前用户昵称 ---
            // 1. 替换所有的 "大菠萝"
            const regex = /大菠萝/g;
            text = text.replace(regex, currentSubject);
            
            // 2. 特殊处理 "菠萝女孩" -> "[昵称]女孩" 
            // 如果生成的句子是 "咱们的菠萝女孩"，且名字不是大菠萝，替换之
            if (currentSubject !== "大菠萝") {
                text = text.replace(/菠萝女孩/g, currentSubject + "女孩");
            }
            
            return text;
        }

        // --- 开场交互逻辑 ---
        const modal = document.getElementById('intro-modal');
        const yesBtn = document.getElementById('yes-btn');
        const confirmBtn = document.getElementById('confirm-name-btn');
        const customInput = document.getElementById('custom-name');
        const footerMsg = document.getElementById('footer-msg');

        function startGame(name) {
            currentSubject = name;
            gameStarted = true;
            modal.style.display = 'none'; // 隐藏弹窗
            
            // 更新语料库中的 subjects 数组
            corpus.subjects = [name, "你", "咱们的" + name, "可爱的你"];

            // --- 修改部分：随机选择底部祝福语 ---
            const footerTemplates = [
                "{name}，生日快乐喔！",
                "{name}，今天有好好吃饭吗？",
                "{name}，今天过得好吗？",
                "{name}，要好好照顾自己喔！",
                "{name}，真高兴这个世界上有你！"
            ];
            
            // 随机选取一句
            const randomIndex = Math.floor(Math.random() * footerTemplates.length);
            const selectedTemplate = footerTemplates[randomIndex];
            
            // 替换名字
            const msg = selectedTemplate.replace("{name}", name);

            // 更新并显示底部祝福语
            footerMsg.textContent = msg;
            footerMsg.style.opacity = "1";
        }

        yesBtn.addEventListener('click', () => {
            startGame("大菠萝");
        });

        confirmBtn.addEventListener('click', () => {
            const name = customInput.value.trim();
            if (name) {
                startGame(name);
            } else {
                // 简单的晃动提示或默认值
                customInput.style.borderColor = "#ff6b6b";
                setTimeout(() => customInput.style.borderColor = "rgba(255,255,255,0.3)", 500);
            }
        });

        // --- 1. 场景初始化 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.0015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
        camera.position.z = 450;
        camera.position.y = 100;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; 

        const cakeGroup = new THREE.Group();
        cakeGroup.position.y = -50; 
        scene.add(cakeGroup);

        // --- 2. 材质 ---
        function getParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.Texture(canvas);
        }
        
        const texture = getParticleTexture();
        texture.needsUpdate = true;

        const particleMaterial = new THREE.PointsMaterial({
            size: 5,
            map: texture,
            transparent: true,
            opacity: 0.8,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const gemMaterial = new THREE.PointsMaterial({
            size: 15,
            map: texture,
            transparent: true,
            opacity: 1.0,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        // --- 3. 数据结构 ---
        const cakeGeoData = { positions: [], colors: [], offsets: [] };
        const textGeoData = { positions: [], colors: [], offsets: [] };
        const starGeoData = { positions: [], colors: [], offsets: [] };
        const gemGeoData = { positions: [], colors: [], offsets: [] };

        function addParticle(x, y, z, colorHex, type = 'cake') {
            const color = new THREE.Color(colorHex);
            let target;
            if (type === 'gem') target = gemGeoData;
            else if (type === 'text') target = textGeoData;
            else if (type === 'star') target = starGeoData;
            else target = cakeGeoData;

            target.positions.push(x, y, z);
            target.colors.push(color.r, color.g, color.b);
            target.offsets.push(Math.random() * Math.PI * 2);
        }

        // --- 4. 生成形状函数 ---
        function createCylinderLayer(radius, height, yBase, count, colorHex) {
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const rRatio = Math.pow(Math.random(), 0.3); 
                const r = radius * rRatio; 
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                const y = yBase + Math.random() * height;
                addParticle(x, y, z, colorHex, 'cake');
            }
            for (let i = 0; i < count * 0.2; i++) {
                const theta = Math.random() * Math.PI * 2;
                const x = radius * Math.cos(theta);
                const z = radius * Math.sin(theta);
                const y = yBase + Math.random() * height;
                addParticle(x, y, z, colorHex, 'cake');
            }
        }

        function createCrown(radius, yBase, colorHex) {
            const spikes = 8; 
            const crownHeight = 35;
            const particleCount = 1200;
            for(let i=0; i<particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const r = radius * (0.95 + Math.random() * 0.05);
                const wave = Math.abs(Math.sin(theta * spikes / 2)); 
                const maxHeight = 10 + wave * crownHeight; 
                const y = yBase + Math.random() * maxHeight;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                addParticle(x, y, z, colorHex, 'cake');
            }
            for(let i=0; i<spikes; i++) {
                const angle = (Math.PI * 2 / spikes) * i;
                const tipHeight = 10 + crownHeight; 
                const x = radius * Math.cos(angle);
                const z = radius * Math.sin(angle);
                addParticle(x, yBase + tipHeight, z, 0xff0055, 'gem'); 
            }
        }

        function createDecorationRing(radius, y, colorHex, count, isGem = false) {
            for(let i=0; i<count; i++) {
                const theta = (Math.PI * 2 / count) * i;
                const x = radius * Math.cos(theta);
                const z = radius * Math.sin(theta);
                addParticle(x, y, z, colorHex, isGem ? 'gem' : 'cake');
            }
        }

        function create3DText(text, yPos) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600;
            canvas.height = 120;
            ctx.font = 'bold 80px Georgia'; 
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const scale = 1.2; 
            for (let y = 0; y < canvas.height; y += 3) {
                for (let x = 0; x < canvas.width; x += 3) {
                    if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                        const posX = (x - canvas.width / 2) * scale;
                        const posY = (canvas.height - y) * scale + yPos;
                        const posZ = (Math.random() - 0.5) * 15;
                        addParticle(posX, posY, posZ, 0xffd700, 'text'); 
                    }
                }
            }
        }

        // --- 5. 构建场景 ---
        createCylinderLayer(110, 50, -80, 2000, 0xcd6133); 
        createDecorationRing(112, -30, 0xffd700, 24, true); 
        createCylinderLayer(80, 40, -30, 1500, 0xff6b81); 
        createDecorationRing(82, 10, 0xffffff, 20, true); 
        createCrown(65, 10, 0xffd700); 

        const candleHeight = 50;
        const candleY = 20;
        for(let i=0; i<200; i++) {
            const theta = Math.random() * Math.PI * 2;
            const r = Math.random() * 6;
            const x = r * Math.cos(theta);
            const z = r * Math.sin(theta);
            addParticle(x, candleY + Math.random() * candleHeight, z, 0xffffff, 'cake');
        }
        const flameBase = { x:0, y: candleY + candleHeight + 5, z:0 };

        create3DText("HAPPY", 140);     
        create3DText("BIRTHDAY", 50);  

        for (let i = 0; i < 1500; i++) {
            const r = 900 + Math.random() * 1000;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            addParticle(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi),
                0xffffff,
                'star'
            );
        }

        function createSystem(data, material) {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(data.positions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(data.colors, 3));
            geo.userData = { initialPositions: new Float32Array(data.positions), offsets: data.offsets };
            return new THREE.Points(geo, material);
        }

        const cakeSystem = createSystem(cakeGeoData, particleMaterial);
        cakeGroup.add(cakeSystem);
        const gemSystem = createSystem(gemGeoData, gemMaterial);
        cakeGroup.add(gemSystem);
        const textSystem = createSystem(textGeoData, particleMaterial);
        scene.add(textSystem);
        const starSystem = createSystem(starGeoData, particleMaterial);
        scene.add(starSystem);

        const flameGeometry = new THREE.BufferGeometry();
        const flameCount = 150;
        const flamePosArr = new Float32Array(flameCount * 3);
        const flameData = []; 
        for(let i=0; i<flameCount; i++) {
            flamePosArr[i*3] = flameBase.x;
            flamePosArr[i*3+1] = flameBase.y;
            flamePosArr[i*3+2] = flameBase.z;
            flameData.push({
                speedY: 0.5 + Math.random() * 1.5,
                drift: (Math.random() - 0.5) * 0.4,
                life: Math.random(),
                offset: Math.random() * 100
            });
        }
        flameGeometry.setAttribute('position', new THREE.BufferAttribute(flamePosArr, 3));
        const flameMat = new THREE.PointsMaterial({
            size: 12, color: 0xff4757, map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8
        });
        const flameMesh = new THREE.Points(flameGeometry, flameMat);
        cakeGroup.add(flameMesh);

        // --- 6. 烟花系统 & 纸条系统 ---
        
        let fireworks = [];
        const noteContainer = document.getElementById('note-container');
        const giftBtn = document.getElementById('gift-btn');
        let isFrenzyMode = false;
        let frenzyInterval = null;
        let frenzyNoteCount = 0;

        // 烟花类 (升级版：中心白光，外层彩色，更明显)
        class Firework {
            constructor(x, y, z) {
                this.geometry = new THREE.BufferGeometry();
                const count = 500; // 再次增加粒子数量
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const sizes = new Float32Array(count);
                const velocities = [];
                
                // 基础色相
                const baseHue = Math.random();
                const isMultiColor = Math.random() > 0.3; // 70% 概率五颜六色

                for(let i=0; i<count; i++) {
                    positions[i*3] = x;
                    positions[i*3+1] = y;
                    positions[i*3+2] = z;

                    // 爆炸速度与方向
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    // 速度分层：2~4.5为核心，4.5~12为外层
                    const speed = 2 + Math.random() * 10; 
                    
                    const color = new THREE.Color();
                    
                    // 核心逻辑：速度慢的是白色核心
                    if (speed < 4.5) {
                        // 暖白核心 (高亮)
                        color.setHSL(0.1, 0.2, 0.9 + Math.random() * 0.1); 
                        sizes[i] = 10 + Math.random() * 10; // 核心粒子稍大
                    } else {
                        // 外层逻辑：彩色
                        if (isMultiColor) {
                            color.setHSL(Math.random(), 0.9, 0.6);
                        } else {
                            // 单色系，带一点点色相偏移
                            color.setHSL(baseHue + (Math.random() - 0.5) * 0.1, 0.9, 0.6);
                        }
                        sizes[i] = 5 + Math.random() * 20; // 外层粒子大小不一
                    }

                    colors[i*3] = color.r;
                    colors[i*3+1] = color.g;
                    colors[i*3+2] = color.b;

                    velocities.push({
                        x: speed * Math.sin(phi) * Math.cos(theta),
                        y: speed * Math.sin(phi) * Math.sin(theta),
                        z: speed * Math.cos(phi)
                    });
                }

                this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                this.geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1)); 
                
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        pointTexture: { value: texture },
                        opacity: { value: 1.0 }
                    },
                    vertexShader: `
                        attribute float size;
                        varying vec3 vColor;
                        void main() {
                            vColor = color;
                            vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
                            // 增大系数让粒子更明显 (300.0 -> 400.0)
                            gl_PointSize = size * ( 400.0 / -mvPosition.z );
                            gl_Position = projectionMatrix * mvPosition;
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D pointTexture;
                        uniform float opacity;
                        varying vec3 vColor;
                        void main() {
                            gl_FragColor = vec4( vColor, opacity );
                            gl_FragColor = gl_FragColor * texture2D( pointTexture, gl_PointCoord );
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    vertexColors: true
                });

                this.mesh = new THREE.Points(this.geometry, this.material);
                this.velocities = velocities;
                this.life = 1.0;
                scene.add(this.mesh);
            }

            update() {
                this.life -= 0.012; // 稍微延长生命 (原0.015)
                this.material.uniforms.opacity.value = this.life;
                
                const pos = this.geometry.attributes.position.array;
                for(let i=0; i<this.velocities.length; i++) {
                    pos[i*3] += this.velocities[i].x;
                    pos[i*3+1] += this.velocities[i].y - 0.06; // 重力
                    pos[i*3+2] += this.velocities[i].z;
                    
                    this.velocities[i].x *= 0.95; // 阻力
                    this.velocities[i].y *= 0.95;
                    this.velocities[i].z *= 0.95;
                }
                this.geometry.attributes.position.needsUpdate = true;

                if (this.life <= 0) {
                    scene.remove(this.mesh);
                    this.geometry.dispose();
                    this.material.dispose();
                    return false; 
                }
                return true; 
            }
        }

        // 创建纸条函数
        function createNote(x, y, text, isPermanent = false) {
            const note = document.createElement('div');
            note.className = 'retro-note';
            note.innerText = text;
            note.style.left = x + 'px';
            note.style.top = y + 'px';
            // 随机旋转一点点
            const rot = (Math.random() - 0.5) * 20;
            note.style.setProperty('--rot', rot + 'deg');

            noteContainer.appendChild(note);

            // 强制重绘后添加显示class以触发transition
            setTimeout(() => note.classList.add('show'), 10);

            if (!isPermanent) {
                setTimeout(() => {
                    note.style.opacity = 0;
                    note.style.transform = 'scale(0.8)';
                    setTimeout(() => note.remove(), 500);
                }, 5000);
            }
            return note;
        }

        // 将屏幕坐标转换为3D坐标 (简单的射线投射)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function triggerExplosion(clientX, clientY) {
            // 如果游戏未开始，不触发烟花
            if (!gameStarted) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // 既然没有实际的物体布满全屏，我们定义一个虚拟的平面，在 Z=0 或 Z=cakeGroup.position.z 处爆炸
            // 为了让烟花有深度感，我们在视线方向上取一个点
            const targetZ = 0; 
            // 计算射线与 Z=0 平面的交点
            // Ray: Origin + t * Direction.  (Origin.z + t * Direction.z) = targetZ
            const t = (targetZ - raycaster.ray.origin.z) / raycaster.ray.direction.z;
            const pos = new THREE.Vector3().copy(raycaster.ray.origin).add(raycaster.ray.direction.multiplyScalar(t));

            // 添加烟花
            fireworks.push(new Firework(pos.x, pos.y, pos.z));

            // 添加纸条
            // 如果是点击触发，纸条出现在点击位置
            // 如果是狂欢模式，纸条位置由调用者决定，这里此函数处理点击
            if (!isFrenzyMode) {
                createNote(clientX, clientY, getCompliment());
            }
        }

        // 监听点击事件
        window.addEventListener('pointerdown', (event) => {
            // 防止点击按钮或弹窗时触发烟花
            if (event.target.id === 'gift-btn' || !gameStarted) return;
            triggerExplosion(event.clientX, event.clientY);
        });

        // 礼物按钮逻辑
        giftBtn.addEventListener('click', () => {
            if (!gameStarted) return; // 游戏未开始不能点击
            
            isFrenzyMode = !isFrenzyMode;
            
            if (isFrenzyMode) {
                giftBtn.classList.add('active');
                frenzyNoteCount = 0; // 重置计数
                
                frenzyInterval = setInterval(() => {
                    // 1. 随机位置放烟花
                    const rx = (Math.random() - 0.5) * 400;
                    const ry = (Math.random() - 0.5) * 400;
                    const rz = (Math.random() - 0.5) * 200;
                    fireworks.push(new Firework(rx, ry, rz));

                    // 2. 随机位置弹纸条 (限制总量 999)
                    if (frenzyNoteCount < 999) {
                        const screenX = Math.random() * (window.innerWidth - 100);
                        const screenY = Math.random() * (window.innerHeight - 50);
                        createNote(screenX, screenY, getCompliment(), true); // 永久显示
                        frenzyNoteCount++;
                    }
                }, 200); // 频率：每200ms一次

            } else {
                giftBtn.classList.remove('active');
                clearInterval(frenzyInterval);
                // 清除所有纸条
                noteContainer.innerHTML = '';
            }
        });


        // --- 7. 动画循环 ---
        let time = 0;
        function updateBreathing(system, time) {
            const pos = system.geometry.attributes.position.array;
            const initPos = system.geometry.userData.initialPositions;
            const offsets = system.geometry.userData.offsets;
            for(let i=0; i<pos.length/3; i++) {
                const idx = i*3;
                pos[idx+1] = initPos[idx+1] + Math.sin(time * 2 + offsets[i]) * 1.5;
            }
            system.geometry.attributes.position.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            controls.update();

            // 旋转蛋糕
            cakeGroup.rotation.y += 0.008;

            // 烟花更新
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const alive = fireworks[i].update();
                if (!alive) {
                    fireworks.splice(i, 1);
                }
            }

            // 火焰动画
            const fPos = flameGeometry.attributes.position.array;
            for(let i=0; i<flameCount; i++) {
                const idx = i*3;
                const d = flameData[i];
                fPos[idx+1] += d.speedY; 
                fPos[idx] += d.drift + Math.sin(time * 3 + d.offset) * 0.1; 
                fPos[idx+2] += d.drift + Math.cos(time * 2 + d.offset) * 0.1;
                d.life -= 0.02;
                if(d.life <= 0 || fPos[idx+1] > flameBase.y + 35) {
                    fPos[idx] = flameBase.x + (Math.random()-0.5)*2;
                    fPos[idx+1] = flameBase.y;
                    fPos[idx+2] = flameBase.z + (Math.random()-0.5)*2;
                    d.life = 1;
                }
            }
            flameGeometry.attributes.position.needsUpdate = true;
            flameMat.opacity = 0.6 + Math.sin(time * 20) * 0.2; 

            // 呼吸动画
            updateBreathing(cakeSystem, time);
            updateBreathing(textSystem, time);
            gemMaterial.size = 15 + Math.sin(time * 5) * 3;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
